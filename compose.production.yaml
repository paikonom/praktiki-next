services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.production
        restart: unless-stopped
        env_file:
            - .env.production
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            PRAKTIKI_PRIVATE_STORAGE_PATH: /var/www/html/storage/app/private
        ports:
            # Public προσωρινά στο 8080, μέχρι να προστεθεί HTTPS/reverse proxy.
            - '${APP_PORT:-8080}:80'
        volumes:
            - '/srv/praktiki-data/private:/var/www/html/storage/app/private'
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
        volumes:
            - '/srv/praktiki-data/mysql:/var/lib/mysql'
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
